name: Publish

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      # Trusted publishing needs npm 11+. Node 22 still ships npm 10, which can
      # sign provenance but then PUT the package as an anonymous user (404).
      - run: npm install -g npm@11
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build
      - run: npm run pack:smoke
      # prepublishOnly already ran typecheck/test/build; skip it so CI does not
      # repeat that work. Provenance comes from the OIDC token above.
      - run: npm publish --provenance --access public --ignore-scripts
